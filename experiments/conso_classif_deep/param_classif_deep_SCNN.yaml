fixed_args:
    options:
        '--model': 'ShortCNN'
        '--loss': 'BCEWithLogits'
        '--optim': 'SGD'
        '--count': 1
        '--finetune': 0

varying_args:
    range:
        options:
            '--batch': [100, 301, 100]
            '--rgb': [0, 2, 1]
            '--epochs': [10, 31, 10]
            
    groups:
        - options:
            '--lr': 0.0001
        
        - options:
            '--lr': 0.001
        
        - options:
            '--lr': 0.01