fixed_args:
    options:
        '--num_epochs': 30
        '--batch_size': 512
        '--data_root': '/media/HDD/ImageNet/ImageNet/imagenet'
        '--pretrained': True
        '--device': 'cuda'
        '--storage_path': './results'
        '--num_workers': 12
        '--prefetch_factor': 4
        

varying_args:
    range:
        options:
            '--seed': [0, 11, 1]

    groups:
        - options:
            '--model': 'resnet18'
        
        - options:
            '--model': 'mobilenet_v2'
        
        - options:
            '--model': 'efficientnet_b0'
