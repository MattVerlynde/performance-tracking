fixed_args:
    options:
        '--model': 'ShortCNN'
        '--loss': 'BCEWithLogits'
        '--optim': 'SGD'
        '--count': 1
        '--finetune': 0
        '--batch': 300
        '--rgb': 1
        '--epochs': 100

varying_args:
    range:
        options:
            '--seed': [0, 10, 1]
    groups:
        - options:
            '--lr': 0.0001
        
        - options:
            '--lr': 0.001
        
        - options:
            '--lr': 0.01